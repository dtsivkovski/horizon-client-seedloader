id = "client_seed_loader"
name = "Client Seed Loader"
version = "0.1.0"
description = "Generate far terrain (LODs) on servers from a known seed. Client-side only."
authors = ["Daniel Tsivkovski"]
api = "0.2"
side = "client"
# Required by the manifest format; this mod registers nothing.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f1bb66f353cf67f2aa4665293fc75c8d91186fc7"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# Seeded far-terrain source, compiled inside the game's world_update module.
[[native.module]]
id = "seeded"
file = "crates/horizon-client/src/game/world/world_update.rs"
name = "csl_seeded"
source = "src/game/seeded.rs"

# Picks the seeded source when this server has a seed; otherwise Horizon's own.
[[native.mixin]]
id = "prepare_lod"
target = "horizon_client::game::world_update::Game<'_>::prepare_lod"
kind = "HEAD"
cancellable = true
helper = "src/mixins/prepare_lod.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }]
