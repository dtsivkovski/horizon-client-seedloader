id = "veinminer"
name = "Veinminer"
version = "0.1.0"
description = "Template Horizon mod: hold sneak to vein-mine connected ores and logs."
authors = ["Horizon"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
# To build as a sandboxed WebAssembly mod instead, remove [native], add `[package.metadata.horizon] sdk = "..."` to Cargo.toml, and run `cargo horizon-mod build --wasm`.
api = "0.2"
side = "server"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f1bb66f353cf67f2aa4665293fc75c8d91186fc7"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
