name: Bug report
description: Something broke or looks wrong.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Join server
        2. Run /lodseed set ...
        3. ...
    validations:
      required: true
  - type: input
    attributes:
      label: Mod version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    attributes:
      label: Horizon build
      description: Shown in launcher.
      placeholder: Nightly 2026-11-22
  - type: textarea
    attributes:
      label: "/lodseed status output"
      render: text
  - type: textarea
    attributes:
      label: Log
      description: Lines mentioning Client Seed Loader, if any.
      render: text
