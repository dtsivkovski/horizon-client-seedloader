name: CI

on:
  push:
    branches: [main]
    # Pushing a tag like v0.1.0 also publishes a release.
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Lets the release step create releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # `cargo horizon-mod check` also checks API against wasm.
          targets: wasm32-unknown-unknown

      - name: Read pinned Horizon commit
        id: pin
        run: echo "rev=$(python3 -c 'import tomllib; print(tomllib.load(open("horizon-mod.toml", "rb"))["native"]["horizon"])')" >> "$GITHUB_OUTPUT"

      # Build tool takes about 10 minutes to compile, so keep it per pin.
      - name: Cache cargo-horizon-mod
        id: tool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-horizon-mod
          key: cargo-horizon-mod-${{ steps.pin.outputs.rev }}

      - name: Install cargo-horizon-mod for pinned Horizon commit
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev "${{ steps.pin.outputs.rev }}" cargo-horizon-mod

      - name: Fetch pinned SDK
        run: cargo horizon-mod check

      - name: Format, clippy, and unit tests
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build and verify .hmod package
        run: |
          cargo horizon-mod build
          cargo horizon-mod check target/horizon-mod/client_seed_loader.hmod

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag must match both manifests.
          grep -qx "version = \"$VERSION\"" horizon-mod.toml
          grep -qx "version = \"$VERSION\"" Cargo.toml
          # Notes are this version's CHANGELOG.md section.
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" target/horizon-mod/client_seed_loader.hmod \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
